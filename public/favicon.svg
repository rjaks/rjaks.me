<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- Terminal Tile -->
  <rect class="bg" x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#30363D" stroke-width="4"/>

  <!-- Command Prompt Chevron -->
  <path class="prompt-chevron" d="M30 40 L56 64 L30 88" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Underscore Cursor -->
  <path class="prompt-cursor" d="M74 88 H98" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>

  <style>
    @media (prefers-color-scheme: light) {
      .bg {
        stroke: #64748B;
      }
    }
  </style>
</svg>
